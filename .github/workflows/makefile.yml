name: Build and Run OS with QEMU

on:
  push:
    branches: [AION]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AION

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential qemu-system

    - name: Build your project
      run: make

    - name: Run QEMU headless and capture output
      run: |
        timeout 30 qemu-system-x86_64 -cdrom aion.iso -nographic -serial stdio > qemu_output.log || true

    - name: Show boot output
      run: cat qemu_output.log

    - name: Upload boot output as artifact
      uses: actions/upload-artifact@v3
      with:
        name: qemu-boot-output
        path: qemu_output.log
